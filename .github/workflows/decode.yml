name: Decode JavaScript File

on:
  push:
    branches:
      - main
    paths-ignore:
      - output.js
      - output.py

jobs:
  decode:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show runtime versions
        run: |
          python --version
          node --version
          npm --version

      - name: Execute Python script for decoding
        run: |
          python src/decode.py

      - name: Install Node.js dependencies
        run: |
          npm install

      - name: Decode JavaScript file
        run: |
          npm run decode -- -i input.js -o output.js

      - name: Configure Git author
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"

      - name: Save decoded output to repository
        run: |
          git status
          ls -la

          git add output.js output.py

          if git diff --cached --quiet; then
            echo "Decoded output has not changed; skipping commit."
          else
            git commit -m "chore: update decoded output"
            git push
          fi
