name: Decode Input Files

on:
  push:
    branches:
      - main
    paths:
      - "input.js"
      - "input.py"

permissions:
  contents: write

concurrency:
  group: decode-inputs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed input files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            js:
              - "input.js"
            py:
              - "input.py"

      # ==============================
      # JavaScript decoding
      # ==============================

      - name: Setup Node.js
        if: steps.changes.outputs.js == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show Node.js versions
        if: steps.changes.outputs.js == 'true'
        run: |
          node --version
          npm --version

      - name: Install Node.js dependencies
        if: steps.changes.outputs.js == 'true'
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Decode input.js
        if: steps.changes.outputs.js == 'true'
        run: |
          echo "检测到 input.js 发生修改，开始执行 JavaScript 解码。"
          npm run decode -- -i input.js -o output.js

          if [ ! -f "output.js" ]; then
            echo "错误：JavaScript 解码后没有生成 output.js"
            exit 1
          fi

      # ==============================
      # Python decoding
      # ==============================

      - name: Setup Python
        if: steps.changes.outputs.py == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show Python version
        if: steps.changes.outputs.py == 'true'
        run: |
          python --version

      - name: Decode input.py
        if: steps.changes.outputs.py == 'true'
        run: |
          echo "检测到 input.py 发生修改，开始执行 Python 解码。"
          python src/decode.py

          if [ ! -f "output.py" ]; then
            echo "错误：Python 解码后没有生成 output.py"
            exit 1
          fi

      # ==============================
      # Commit generated output
      # ==============================

      - name: Configure Git author
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"

      - name: Add generated output files
        env:
          JS_CHANGED: ${{ steps.changes.outputs.js }}
          PY_CHANGED: ${{ steps.changes.outputs.py }}
        run: |
          if [ "$JS_CHANGED" = "true" ]; then
            echo "添加 output.js"
            git add output.js
          fi

          if [ "$PY_CHANGED" = "true" ]; then
            echo "添加 output.py"
            git add output.py
          fi

          git status

      - name: Commit and push outputs
        env:
          JS_CHANGED: ${{ steps.changes.outputs.js }}
          PY_CHANGED: ${{ steps.changes.outputs.py }}
        run: |
          if git diff --cached --quiet; then
            echo "输出文件没有发生变化，跳过提交。"
            exit 0
          fi

          if [ "$JS_CHANGED" = "true" ] && [ "$PY_CHANGED" = "true" ]; then
            COMMIT_MESSAGE="chore: update JavaScript and Python outputs"
          elif [ "$JS_CHANGED" = "true" ]; then
            COMMIT_MESSAGE="chore: update JavaScript output"
          else
            COMMIT_MESSAGE="chore: update Python output"
          fi

          git commit -m "$COMMIT_MESSAGE"
          git push
